# fly.toml app configuration file generated for agent-memory-server on 2026-08-31T18:15:48-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'agent-memory-server'
primary_region = 'ewr'

[build]
[[mounts]]
  source = 'data'
  destination = '/app/data'

[http_service]
  internal_port = 8402
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
